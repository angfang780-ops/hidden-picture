<!doctype html>
<html lang="ko">
<head>
<title>숨은그림 찾기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12261F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="숨은그림">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1D3A33;
    --felt-deep:#12261F;
    --bar:#0E1F1A;
    --ink:#ECE5D3;
    --ink-dim:#9FB3A8;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn,.sel{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible,.sel:focus-visible,.vh:focus-visible + label,.item:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .btn[data-armed="1"]{background:#7A2E22;border-color:#C25A45;color:#FFE9E2}
  .sel{appearance:none;-webkit-appearance:none;padding-right:40px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
    background-position:calc(100% - 22px) 26px,calc(100% - 16px) 26px;background-size:6px 6px;background-repeat:no-repeat;background-color:var(--chip)}
  .sel option{background:var(--bar);color:var(--ink)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stage{position:absolute;inset:0}
  #board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .gear{
    position:absolute;right:12px;top:12px;min-height:54px;padding:0 22px;font-size:20px;font-weight:700;
    background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)
  }
  /* 왼쪽 「찾을 그림」 목록 — 누르면 그 그림이 있는 쪽을 알려 준다 */
  .list{
    position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:10px 8px;background:var(--bar);border-right:1px solid var(--line);overflow:hidden
  }
  .item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;
    padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-weight:700;line-height:1.1;cursor:pointer;touch-action:manipulation
  }
  .item svg{flex:1 1 auto;min-height:0;width:100%;fill:currentColor}
  .item.found{background:var(--brass);color:var(--brass-ink);border-color:transparent}
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(6,16,13,.55);overflow:auto}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:19px;font-variant-numeric:tabular-nums}
  .card dt{color:var(--ink-dim)}
  .card dd{margin:0;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
  .album{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px dashed var(--line)}
  .album .note{font-size:16px}
  .album .note b{color:var(--brass)}
  .toast{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);
    padding:12px 18px;border-radius:12px;background:#3A1E18;border:1px solid #9C4A38;color:#FFE4DB;font-size:17px
  }
  @media (prefers-reduced-motion:no-preference){
    .btn,.item{transition:background .15s,border-color .15s,color .15s}
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="board" role="img" aria-label="숨은그림 판"></canvas>
    <nav class="list" id="list" aria-label="찾을 그림"></nav>
    <button id="gear" class="btn gear" type="button">설정</button>
    <div class="toast" id="toast" hidden></div>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <input id="file" class="vh" type="file" accept="image/*">
          <label for="file" class="btn primary wide">사진 한 장 고르기</label>
          <input id="dir" class="vh" type="file" webkitdirectory multiple>
          <label for="dir" class="btn wide" id="dirLbl">폴더 고르기</label>
          <div class="album wide" id="album" hidden>
            <p class="note">사진 묶음 <b id="albumN">0</b>장 · 다 찾으면 이 중에서 다른 사진이 나와요</p>
            <div class="grid2">
              <button id="next" class="btn" type="button">다른 사진으로</button>
              <button id="albumClear" class="btn" type="button">묶음 비우기</button>
            </div>
          </div>
          <select id="level" class="sel wide" aria-label="난이도">
            <option value="1">쉬움 · 5개</option>
            <option value="2">보통 · 7개</option>
            <option value="3">어려움 · 10개</option>
          </select>
          <button id="again" class="btn" type="button">새로 숨기기</button>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="full" class="btn wide" type="button">전체 화면</button>
        </div>
        <p class="note" id="stat">시간 <b id="tm">0:00</b> · 찾은 그림 <b id="pc">0/0</b> · 왼쪽 그림을 누르면 있는 곳을 알려 줘요</p>
        <button id="menuClose" class="btn primary" type="button">닫고 찾기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2>다 찾았어요!</h2>
        <dl>
          <dt>걸린 시간</dt><dd id="dTm">0:00</dd>
          <dt>찾은 그림</dt><dd id="dPc">0</dd>
        </dl>
        <button id="doneNext" class="btn primary" type="button" hidden>다른 사진으로</button>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
        <button id="doneClose" class="btn" type="button">그림 보기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#board'), ctx = cv.getContext('2d');
  const stage = $('#stage'), list = $('#list');
  const turned = matchMedia('(orientation: portrait)');
  const KEY = 'hidden.v1';
  const DONE_DELAY = 4, DONE_DELAY_ALBUM = 6; // 다 찾은 뒤 사진만 보여 주는 초 (사진 한 장 / 폴더 묶음)
  // 난이도: 숨길 개수, 크기(사진 짧은 변 대비), 테두리 진하기, 밝기 차이
  const LEVELS = {
    1: { n: 5,  size: .16, line: .55, tint: .22 },
    2: { n: 7,  size: .12, line: .38, tint: .15 },
    3: { n: 10, size: .09, line: .26, tint: .10 }
  };
  const star = (() => {
    let d = '';
    for (let i = 0; i < 10; i++){
      const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? 19 : 44;
      d += (i ? 'L' : 'M') + (50 + r*Math.cos(a)).toFixed(1) + ' ' + (54 + r*Math.sin(a)).toFixed(1);
    }
    return d + 'Z';
  })();
  // 숨길 물건 모양 (100×100 칸 안의 SVG 경로)
  const SHAPES = [
    { name: '열쇠',   d: 'M28 30A20 20 0 1 1 27.99 30Z M28 42A8 8 0 1 0 28.01 42Z M46 45H92V55H46Z M76 55H83V68H76Z M86 55H92V65H86Z' },
    { name: '우산',   d: 'M10 52A40 40 0 0 1 90 52Z M48 52H52V82A8 8 0 0 1 36 82H40A4 4 0 0 0 48 82Z' },
    { name: '물고기', d: 'M18 50Q45 20 72 50Q45 80 18 50Z M68 50L92 30L86 50L92 70Z' },
    { name: '별',     d: star },
    { name: '하트',   d: 'M50 86C20 62 8 45 14 30C20 15 42 14 50 30C58 14 80 15 86 30C92 45 80 62 50 86Z' },
    { name: '컵',     d: 'M20 28H66V72Q66 84 54 84H32Q20 84 20 72Z M66 38A16 16 0 0 1 66 70V62A8 8 0 0 0 66 46Z' },
    { name: '나뭇잎', d: 'M14 86Q12 22 86 14Q84 84 14 86Z' },
    { name: '새',     d: 'M8 46Q30 26 50 48Q70 26 92 46Q70 40 50 64Q30 40 8 46Z' },
    { name: '달',     d: 'M60 12A38 38 0 1 0 60 88A50 50 0 0 1 60 12Z' },
    { name: '종',     d: 'M50 12Q30 14 28 40Q27 62 16 72H84Q73 62 72 40Q70 14 50 12Z M42 76A8 8 0 0 0 58 76Z' },
    { name: '집',     d: 'M50 12L90 46H78V88H22V46H10Z' },
    { name: '숟가락', d: 'M50 8C66 8 68 34 55 42L55 88Q50 94 45 88L45 42C32 34 34 8 50 8Z' },
    { name: '연필',   d: 'M14 86L20 66L70 16L84 30L34 80Z' }
  ];
  const PATHS = SHAPES.map(s => new Path2D(s.d));

  let W = 0, H = 0, dpr = 1, S = 1, OX = 0, OY = 0;
  let G = null, dirty = true, felt = null;
  let soundOn = true, showDone = true;
  let fx = []; // 잠깐 보이는 표시: 빗나간 곳 동그라미, 힌트 동그라미

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  };
  const rnd = (a,b) => a + Math.random()*(b-a);
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- hiding ----------
  // 사진을 작게 줄여 칸마다 무늬가 얼마나 복잡한지(밝기 흩어짐) 잰다 — 하늘·벽처럼 밋밋한 곳에 숨기면 바로 보여서
  function busyMap(base){
    const gw = 96, gh = Math.max(1, Math.round(96*base.height/base.width));
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(base, 0, 0, gw, gh);
    const px = g.getImageData(0, 0, gw, gh).data, lum = new Float32Array(gw*gh);
    for (let i = 0; i < lum.length; i++) lum[i] = .299*px[i*4] + .587*px[i*4+1] + .114*px[i*4+2];
    const k = gw/base.width;
    return (x, y, s) => {
      const x0 = Math.max(0, Math.floor((x - s/2)*k)), x1 = Math.min(gw-1, Math.ceil((x + s/2)*k));
      const y0 = Math.max(0, Math.floor((y - s/2)*k)), y1 = Math.min(gh-1, Math.ceil((y + s/2)*k));
      let n = 0, sum = 0, sq = 0;
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++){ const v = lum[yy*gw + xx]; n++; sum += v; sq += v*v; }
      const m = sum/n;
      return Math.sqrt(Math.max(0, sq/n - m*m));
    };
  }
  function hide(base, level){
    const L = LEVELS[level], w = base.width, h = base.height, short = Math.min(w, h);
    const busy = busyMap(base), BUSY = 24;
    const objs = [];
    for (const t of shuffle(SHAPES.map((_, i) => i)).slice(0, L.n)){
      let best = null, bestScore = -Infinity;
      for (let i = 0; i < 400; i++){
        const s = short*L.size*rnd(.9, 1.12), m = s*.6;
        const o = { t, x: rnd(m, w-m), y: rnd(m, h-m), s, r: rnd(-.5, .5), f: 0 };
        // 설정 버튼이 덮는 오른쪽 위 구석은 피한다
        if (o.x > w - short*.25 && o.y < short*.16) continue;
        const gap = Math.min(Infinity, ...objs.map(q => Math.hypot(q.x-o.x, q.y-o.y) - (q.s+o.s)*.62));
        if (gap <= 0) continue;
        const b = busy(o.x, o.y, s);
        // 무늬가 복잡한 곳일수록 좋다 (모자라면 그중 가장 복잡한 곳)
        const score = Math.min(b, BUSY*1.5) + Math.min(gap/short, .1)*40;
        if (score > bestScore){ best = o; bestScore = score; }
        if (b >= BUSY*1.5 && gap > short*.04) break;
      }
      if (best) objs.push(best);
    }
    return objs.map(o => ({ t: o.t, x: +o.x.toFixed(1), y: +o.y.toFixed(1), s: +o.s.toFixed(1), r: +o.r.toFixed(3), f: 0 }));
  }
  // 모양 안을 옆자리 사진 무늬로 채우고, 그 자리 밝기에 맞춰 살짝만 밝게/어둡게 + 가는 테두리
  function paint(base, objs, L){
    const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(base, 0, 0);
    for (const o of objs){
      const k = o.s/100;
      const place = () => { g.setTransform(1, 0, 0, 1, 0, 0); g.translate(o.x, o.y); g.rotate(o.r); g.scale(k, k); g.translate(-50, -50); };
      const x0 = Math.max(0, Math.round(o.x - o.s/2)), y0 = Math.max(0, Math.round(o.y - o.s/2));
      const sw = Math.max(1, Math.min(c.width - x0, Math.round(o.s))), sh = Math.max(1, Math.min(c.height - y0, Math.round(o.s)));
      const px = g.getImageData(x0, y0, sw, sh).data;
      let sum = 0, n = 0;
      for (let i = 0; i < px.length; i += 16){ sum += .299*px[i] + .587*px[i+1] + .114*px[i+2]; n++; }
      const light = sum/n < 140, tone = light ? '255,255,255' : '0,0,0';
      g.save(); place(); g.clip(PATHS[o.t]);
      g.setTransform(1, 0, 0, 1, 0, 0);
      const a = o.r*7 + o.t, d = o.s*.22;
      g.drawImage(base, d*Math.cos(a), d*Math.sin(a));
      g.fillStyle = `rgba(${tone},${L.tint})`; g.fillRect(0, 0, c.width, c.height);
      g.restore();
      g.save(); place(); g.lineJoin = 'round';
      g.lineWidth = Math.max(1.6, o.s*.014)/k;
      g.strokeStyle = `rgba(${tone},${L.line})`; g.stroke(PATHS[o.t]);
      g.restore();
    }
    return c;
  }

  // ---------- game state ----------
  function build(base, level, sample, dataURL, saved){
    const objs = saved ? saved.objs : hide(base, level);
    G = { base, sample, dataURL, level, objs, scene: paint(base, objs, LEVELS[level]),
          elapsed: saved ? saved.el || 0 : 0, done: !!(saved && saved.done), started: false };
    fx = [];
    buildList();
    layout();
    showDone = true;
    syncUI();
    save();
  }
  function newGame(img, level, sample, dataURL){
    if (!sample && !dataURL){
      try { dataURL = img.toDataURL('image/jpeg', .85); } catch(e){ dataURL = null; }
    }
    build(img, level, sample, dataURL, null);
    $('#menu').hidden = true;
  }
  const level = () => +$('#level').value;
  const foundN = () => G.objs.filter(o => o.f).length;

  function finish(){
    G.done = true; G.started = false; showDone = false;
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110));
    syncUI();
    // 다 찾은 사진을 먼저 보여 주고, 몇 초 뒤에 완성 창을 띄운다 (사진 묶음이면 조금 더 길게)
    const cur = G;
    setTimeout(() => { if (G === cur) openDone(); }, (album.length ? DONE_DELAY_ALBUM : DONE_DELAY)*1000);
  }
  function openDone(){
    if (!G || !G.done || showDone) return;
    showDone = true; syncUI();
    if (album.length) startAuto();
  }

  // ---------- side list ----------
  function buildList(){
    list.textContent = '';
    G.objs.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'item'; b.type = 'button'; b.dataset.i = i;
      b.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${SHAPES[o.t].d}"/></svg><span>${SHAPES[o.t].name}</span>`;
      list.appendChild(b);
    });
  }
  function sizeList(){
    if (!G) return;
    const n = G.objs.length, lw = Math.round(Math.min(150, Math.max(92, W*.11)));
    const ih = Math.max(44, Math.min(lw*1.05, (H - 20 - 8*(n-1))/n));
    list.style.width = lw + 'px';
    for (const b of list.children){
      b.style.height = ih + 'px';
      b.style.fontSize = Math.round(Math.max(13, Math.min(18, ih*.2))) + 'px';
      b.lastChild.hidden = ih < 58; // 칸이 작으면 이름은 빼고 그림만
    }
  }
  function syncList(){
    if (!G) return;
    [...list.children].forEach((b, i) => {
      const o = G.objs[i];
      b.classList.toggle('found', !!o.f);
      b.lastChild.textContent = (o.f ? '✓ ' : '') + SHAPES[o.t].name;
      b.setAttribute('aria-label', SHAPES[o.t].name + (o.f ? ' — 찾음' : ' — 누르면 있는 곳을 알려 줘요'));
    });
  }
  list.addEventListener('click', e => {
    const b = e.target.closest('.item');
    if (!b || !G || G.done) return;
    wakeAudio();
    const o = G.objs[+b.dataset.i];
    if (o.f){ o.ft = performance.now(); dirty = true; return; }
    // 정확한 자리 대신 그 근처를 큰 동그라미로 알려 준다
    const a = rnd(0, Math.PI*2), d = rnd(0, o.s*.7);
    fx.push({ kind: 'hint', x: o.x + d*Math.cos(a), y: o.y + d*Math.sin(a), r: o.s*1.7, t0: performance.now(), dur: 2400 });
    beep(440, .08);
    dirty = true;
  });

  // ---------- rendering ----------
  function makeFelt(){
    const c = document.createElement('canvas'); c.width = c.height = 192;
    const g = c.getContext('2d');
    g.fillStyle = '#1D3A33'; g.fillRect(0,0,192,192);

  function layout(){

    const x = turned.matches ? e.clientY - r.top : e.clientX - r.left;

    wakeAudio(); wake();

    G.started = true;

  // ---------- images ----------
  function fit(im, max){
    const s = Math.min(1, max / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));

    if (c.height <= c.width) return c;

    const hill = (x, y, rw, rh, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rw, rh, 0, Math.PI, 0); g.fill(); };

  // ---------- photo album: several photos, a random other one after each finish ----------

    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => toast('이 기기에서는 전체 화면을 쓸 수 없어요.')); }
    } catch(e){ toast('이 기기에서는 전체 화면을 쓸 수 없어요.'); }
    $('#menu').hidden = true;
  });
  $('#doneClose').addEventListener('click', () => { stopAuto(); showDone = false; $('#done').hidden = true; });

  // clock: runs only after the first tap and while the page is visible
  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (G && G.started && !G.done && !document.hidden){ G.elapsed += now - last; syncStats(); }
    last = now;
  }, 500);
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden) save(); else if (G && G.started) wake();
  });
  window.addEventListener('pagehide', save);

  new ResizeObserver(layout).observe(stage);

  boot();
  requestAnimationFrame(frame);
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
