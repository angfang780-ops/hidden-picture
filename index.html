<!doctype html>
<html lang="ko">
<head>
<title>숨은그림 찾기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="숨은그림">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn,.sel{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible,.sel:focus-visible,.vh:focus-visible + label,.item:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .btn[data-armed="1"]{background:#7A2E22;border-color:#C25A45;color:#FFE9E2}
  .sel{appearance:none;-webkit-appearance:none;padding-right:40px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
    background-position:calc(100% - 22px) 26px,calc(100% - 16px) 26px;background-size:6px 6px;background-repeat:no-repeat;background-color:var(--chip)}
  .sel option{background:var(--bar);color:var(--ink)}
  /* 난이도는 앱 안의 버튼으로 고른다 — 기기 기본 선택 창(select)은 돌린 화면을 따라 돌지 않아 세로로 크게 뜬다 */
  .seg{display:flex;align-items:center;gap:6px}
  .seg .btn{flex:1 1 0;min-width:0;min-height:58px;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stage{position:absolute;inset:0}
  #board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .gear{
    position:absolute;right:12px;top:12px;min-height:54px;padding:0 22px;font-size:20px;font-weight:700;
    background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)
  }
  .hint{
    position:absolute;right:12px;bottom:12px;min-height:64px;padding:0 26px;font-size:22px;font-weight:700;
    background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)
  }
  /* 왼쪽 「찾을 그림」 목록 — 누르면 그 그림이 있는 쪽을 알려 준다 */
  .list{
    position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:8px;
    padding:10px 8px;background:var(--bar);border-right:1px solid var(--line);overflow:hidden
  }
  .item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:0 0 auto;
    padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-weight:700;line-height:1.1;cursor:pointer;touch-action:manipulation
  }
  .item svg{flex:1 1 auto;min-height:0;width:100%;fill:currentColor}
  .item.found{background:var(--brass);color:var(--brass-ink);border-color:transparent}
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:19px;font-variant-numeric:tabular-nums}
  .card dt{color:var(--ink-dim)}
  .card dd{margin:0;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
  .album{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px dashed var(--line)}
  .album .note{font-size:16px}
  .album .note b{color:var(--brass)}
  .toast{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);
    padding:12px 18px;border-radius:12px;background:#3A1E18;border:1px solid #9C4A38;color:#FFE4DB;font-size:17px
  }
  @media (prefers-reduced-motion:no-preference){
    .btn,.item{transition:background .15s,border-color .15s,color .15s}
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="board" role="img" aria-label="숨은그림 판"></canvas>
    <nav class="list" id="list" aria-label="찾을 그림"></nav>
    <button id="gear" class="btn gear" type="button">설정</button>
    <button id="hint" class="btn hint" type="button">힌트</button>
    <div class="toast" id="toast" hidden></div>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <input id="file" class="vh" type="file" accept="image/*">
          <div id="mode" class="seg wide" role="group" aria-label="무엇으로 할까요">
            <button class="btn" type="button" data-v="art" aria-pressed="true">동화 그림</button>
            <button class="btn" type="button" data-v="photo" aria-pressed="false">내 사진</button>
          </div>
          <label for="file" class="btn wide">사진 한 장 고르기</label>
          <input id="dir" class="vh" type="file" webkitdirectory multiple>
          <label for="dir" class="btn wide" id="dirLbl">폴더 고르기</label>
          <div class="album wide" id="album" hidden>
            <p class="note">사진 묶음 <b id="albumN">0</b>장 · 다 찾으면 이 중에서 다른 사진이 나와요</p>
            <div class="grid2">
              <button id="next" class="btn" type="button">다른 사진으로</button>
              <button id="albumClear" class="btn" type="button">묶음 비우기</button>
            </div>
          </div>
          <div id="level" class="seg wide" role="group" aria-label="난이도">
            <button class="btn" type="button" data-v="1" aria-pressed="true">쉬움 5개</button>
            <button class="btn" type="button" data-v="2" aria-pressed="false">보통 7개</button>
            <button class="btn" type="button" data-v="3" aria-pressed="false">어려움 10개</button>
          </div>
          <button id="again" class="btn" type="button">새로 숨기기</button>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="full" class="btn wide" type="button">전체 화면</button>
        </div>
        <p class="note" id="stat">시간 <b id="tm">0:00</b> · 찾은 그림 <b id="pc">0/0</b> · 「힌트」나 왼쪽 그림을 누르면 있는 곳을 알려 줘요 (여러 번 누를수록 더 정확히)</p>
        <button id="menuClose" class="btn primary" type="button">닫고 찾기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2>다 찾았어요!</h2>
        <dl>
          <dt>걸린 시간</dt><dd id="dTm">0:00</dd>
          <dt>찾은 그림</dt><dd id="dPc">0</dd>
        </dl>
        <button id="doneNext" class="btn primary" type="button" hidden>다른 사진으로</button>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
        <button id="doneClose" class="btn" type="button">그림 보기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#board'), ctx = cv.getContext('2d');
  const stage = $('#stage'), list = $('#list');
  const turned = matchMedia('(orientation: portrait)');
  const KEY = 'hidden.v1', MODE = 'hidden.mode';
  let mode = 'art'; // 'art' 동화 그림(기본) / 'photo' 내 사진 — boot에서 저장값을 읽는다
  const DONE_DELAY = 1, DONE_DELAY_ALBUM = 1; // 다 찾은 뒤 완성 창이 뜨기까지 초 (사진 한 장 / 폴더 묶음) — 사용자 요청으로 바로 뜨게 줄임
  // 난이도: 숨길 개수, 크기(사진 짧은 변 대비), 테두리 진하기, 밝기 차이
  const LEVELS = {
    1: { n: 5,  size: .16, line: .55, tint: .22 },
    2: { n: 7,  size: .12, line: .38, tint: .15 },
    3: { n: 10, size: .09, line: .26, tint: .10 }
  };
  const star = (() => {
    let d = '';
    for (let i = 0; i < 10; i++){
      const a = -Math.PI/2 + i*Math.PI/5, r = i % 2 ? 19 : 44;
      d += (i ? 'L' : 'M') + (50 + r*Math.cos(a)).toFixed(1) + ' ' + (54 + r*Math.sin(a)).toFixed(1);
    }
    return d + 'Z';
  })();
  // 숨길 물건 모양 (100×100 칸 안의 SVG 경로)
  const SHAPES = [
    { name: '열쇠',   d: 'M28 30A20 20 0 1 1 27.99 30Z M28 42A8 8 0 1 0 28.01 42Z M46 45H92V55H46Z M76 55H83V68H76Z M86 55H92V65H86Z' },
    { name: '우산',   d: 'M10 52A40 40 0 0 1 90 52Z M48 52H52V82A8 8 0 0 1 36 82H40A4 4 0 0 0 48 82Z' },
    { name: '물고기', d: 'M18 50Q45 20 72 50Q45 80 18 50Z M68 50L92 30L86 50L92 70Z' },
    { name: '별',     d: star },
    { name: '하트',   d: 'M50 86C20 62 8 45 14 30C20 15 42 14 50 30C58 14 80 15 86 30C92 45 80 62 50 86Z' },
    { name: '컵',     d: 'M20 28H66V72Q66 84 54 84H32Q20 84 20 72Z M66 38A16 16 0 0 1 66 70V62A8 8 0 0 0 66 46Z' },
    { name: '나뭇잎', d: 'M14 86Q12 22 86 14Q84 84 14 86Z' },
    { name: '새',     d: 'M8 46Q30 26 50 48Q70 26 92 46Q70 40 50 64Q30 40 8 46Z' },
    { name: '달',     d: 'M60 12A38 38 0 1 0 60 88A50 50 0 0 1 60 12Z' },
    { name: '종',     d: 'M50 12Q30 14 28 40Q27 62 16 72H84Q73 62 72 40Q70 14 50 12Z M42 76A8 8 0 0 0 58 76Z' },
    { name: '집',     d: 'M50 12L90 46H78V88H22V46H10Z' },
    { name: '숟가락', d: 'M50 8C66 8 68 34 55 42L55 88Q50 94 45 88L45 42C32 34 34 8 50 8Z' },
    { name: '연필',   d: 'M14 86L20 66L70 16L84 30L34 80Z' }
  ];
  const PATHS = SHAPES.map(s => new Path2D(s.d));

  let W = 0, H = 0, dpr = 1, S = 1, OX = 0, OY = 0;
  let G = null, dirty = true, felt = null;
  let soundOn = true, showDone = true;
  let fx = []; // 잠깐 보이는 표시: 빗나간 곳 동그라미, 힌트 동그라미

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  };
  const rnd = (a,b) => a + Math.random()*(b-a);
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- hiding ----------
  // 사진을 작게 줄여 칸마다 무늬가 얼마나 복잡한지(밝기 흩어짐) 잰다 — 하늘·벽처럼 밋밋한 곳에 숨기면 바로 보여서
  function busyMap(base){
    const gw = 96, gh = Math.max(1, Math.round(96*base.height/base.width));
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(base, 0, 0, gw, gh);
    const px = g.getImageData(0, 0, gw, gh).data, lum = new Float32Array(gw*gh);
    for (let i = 0; i < lum.length; i++) lum[i] = .299*px[i*4] + .587*px[i*4+1] + .114*px[i*4+2];
    const k = gw/base.width;
    return (x, y, s) => {
      const x0 = Math.max(0, Math.floor((x - s/2)*k)), x1 = Math.min(gw-1, Math.ceil((x + s/2)*k));
      const y0 = Math.max(0, Math.floor((y - s/2)*k)), y1 = Math.min(gh-1, Math.ceil((y + s/2)*k));
      let n = 0, sum = 0, sq = 0;
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++){ const v = lum[yy*gw + xx]; n++; sum += v; sq += v*v; }
      const m = sum/n;
      return Math.sqrt(Math.max(0, sq/n - m*m));
    };
  }
  function hide(base, level){
    const L = LEVELS[level], w = base.width, h = base.height, short = Math.min(w, h);
    const busy = busyMap(base), BUSY = 24;
    const objs = [];
    for (const t of shuffle(SHAPES.map((_, i) => i)).slice(0, L.n)){
      let best = null, bestScore = -Infinity;
      for (let i = 0; i < 400; i++){
        const s = short*L.size*rnd(.9, 1.12), m = s*.6;
        const o = { t, x: rnd(m, w-m), y: rnd(m, h-m), s, r: rnd(-.5, .5), f: 0 };
        // 설정 버튼이 덮는 오른쪽 위 구석은 피한다
        if (o.x > w - short*.25 && o.y < short*.16) continue;
        const gap = Math.min(Infinity, ...objs.map(q => Math.hypot(q.x-o.x, q.y-o.y) - (q.s+o.s)*.62));
        if (gap <= 0) continue;
        const b = busy(o.x, o.y, s);
        // 무늬가 복잡한 곳일수록 좋다 (모자라면 그중 가장 복잡한 곳)
        const score = Math.min(b, BUSY*1.5) + Math.min(gap/short, .1)*40;
        if (score > bestScore){ best = o; bestScore = score; }
        if (b >= BUSY*1.5 && gap > short*.04) break;
      }
      if (best) objs.push(best);
    }
    return objs.map(o => ({ t: o.t, x: +o.x.toFixed(1), y: +o.y.toFixed(1), s: +o.s.toFixed(1), r: +o.r.toFixed(3), f: 0 }));
  }
  // 모양 안을 옆자리 사진 무늬로 채우고, 그 자리 밝기에 맞춰 살짝만 밝게/어둡게 + 가는 테두리
  function paint(base, objs, L){
    const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(base, 0, 0);
    for (const o of objs){
      const k = o.s/100;
      const place = () => { g.setTransform(1, 0, 0, 1, 0, 0); g.translate(o.x, o.y); g.rotate(o.r); g.scale(k, k); g.translate(-50, -50); };
      const x0 = Math.max(0, Math.round(o.x - o.s/2)), y0 = Math.max(0, Math.round(o.y - o.s/2));
      const sw = Math.max(1, Math.min(c.width - x0, Math.round(o.s))), sh = Math.max(1, Math.min(c.height - y0, Math.round(o.s)));
      const px = g.getImageData(x0, y0, sw, sh).data;
      let sum = 0, n = 0;
      for (let i = 0; i < px.length; i += 16){ sum += .299*px[i] + .587*px[i+1] + .114*px[i+2]; n++; }
      const light = sum/n < 140, tone = light ? '255,255,255' : '0,0,0';
      g.save(); place(); g.clip(PATHS[o.t]);
      g.setTransform(1, 0, 0, 1, 0, 0);
      const a = o.r*7 + o.t, d = o.s*.22;
      g.drawImage(base, d*Math.cos(a), d*Math.sin(a));
      g.fillStyle = `rgba(${tone},${L.tint})`; g.fillRect(0, 0, c.width, c.height);
      g.restore();
      g.save(); place(); g.lineJoin = 'round';
      g.lineWidth = Math.max(1.6, o.s*.014)/k;
      g.strokeStyle = `rgba(${tone},${L.line})`; g.stroke(PATHS[o.t]);
      g.restore();
    }
    return c;
  }

  // ---------- 동화 그림 장면 (틀린 그림 찾기 앱과 같은 그림 도구) ----------
  // 집·나무·해·구름·새·꽃 같은 물건을 하나하나 그려 장면을 만든다
  const AW = 1400, AH = 1000, INK = '#3A2E2A', BIG = 1.35; // BIG: 태블릿에서 물건이 잘 보이게 키우는 비율
  const PAL = {
    roof: ['#C9472F', '#2F6FB3', '#7B4FA0', '#2E8B57', '#D9822B'],
    wall: ['#F4E3C3', '#FBF3E4', '#E9D3B0', '#F2D7D5'],
    door: ['#7A4A2A', '#3D6FB6', '#2E8B57', '#C9472F'],
    leaf: ['#4E9A3E', '#2F7D32', '#7CB342', '#3E8E5E'],
    bright: ['#E53935', '#FB8C00', '#FDD835', '#8E44AD', '#1E88E5', '#F06292', '#43A047'],
    fish: ['#FB8C00', '#E53935', '#FDD835', '#29B6F6', '#AB47BC']
  };
  const pickA = a => a[Math.floor(Math.random()*a.length)];
  const otherOf = (a, v) => pickA(a.filter(x => x !== v));
  // 물건 크기 (가로, 세로) — s는 물건의 기준 크기(px)
  const BOX = { house: [1, 1.05], barn: [1.2, 1.05], tree: [.8, 1.1], pine: [.6, 1.1], sun: [1, 1], moon: [.9, .9], cloud: [1.6, .7],
    bird: [.7, .4], flower: [.4, .8], butterfly: [.6, .5], boat: [1.3, 1], fish: [.8, .45], umbrella: [.9, 1], star: [.5, .5],
    balloon: [.45, 1.1], mushroom: [.55, .5], chicken: [.7, .65], fence: [1.4, .45], kite: [.6, 1.2], bench: [1, .5], starfish: [.5, .5] };
  const FLIPPY = ['bird', 'boat', 'fish', 'chicken'];

    for (let i = 0; i < 2600; i++){
      const y = 860 + r()*(h-860), sz = 2 + (y-840)/260*5*r();
      g.fillStyle = r() < .25 ? '#6E9A3E' : (r() < .5 ? '#FFE067' : '#F5CE35');
      g.beginPath(); g.arc(r()*w, y, sz, 0, Math.PI*2); g.fill();
    }
    // 돌담
    for (let x = -20; x < w + 40; x += 46 + r()*18){
      const y = 835 + r()*8, rw = 26 + r()*14, rh = 18 + r()*8;
      g.fillStyle = r() < .5 ? '#34393B' : '#2A2F31';
      g.beginPath(); g.ellipse(x, y, rw, rh, r()*.6-.3, 0, Math.PI*2); g.fill();
      g.fillStyle = 'rgba(255,255,255,.08)';
      g.beginPath(); g.arc(x - rw*.3, y - rh*.3, 4, 0, Math.PI*2); g.fill();
    }
    return c;
  }

  // ---------- photo album: several photos, a random other one after each finish ----------
  const ALBUM = 'hidden.album', AUTO_SEC = 10;
  let album = [];   // keys into the photo store (File objects when the store can't be opened)
  let bag = [];     // keys not shown yet this round
  let curKey = null, importJob = 0, dbp = null;

  function db(){
    if (!dbp) dbp = new Promise((ok, no) => {
      try {
        const rq = indexedDB.open('hidden', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('photos');
        rq.onsuccess = () => ok(rq.result);
        rq.onerror = () => no(rq.error);
      } catch(e){ no(e); }
    });
    return dbp;
  }
  function idb(mode, fn){
    return db().then(d => new Promise((ok, no) => {
      const tx = d.transaction('photos', mode), r = fn(tx.objectStore('photos'));
      tx.oncomplete = () => ok(r && r.result);
      tx.onerror = tx.onabort = () => no(tx.error);
    }));
  }
  function loadFit(blob){
    return new Promise((ok, no) => {
      const url = URL.createObjectURL(blob), im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); ok(fit(im, 1800)); };
      im.onerror = () => { URL.revokeObjectURL(url); no(new Error('decode')); };
      im.src = url;
    });
  }
  const toJpeg = c => new Promise((ok, no) => c.toBlob(b => b ? ok(b) : no(new Error('blob')), 'image/jpeg', .85));
  const isNum = k => typeof k === 'number';

  function saveAlbum(){
    store.set(ALBUM, JSON.stringify({ keys: album.filter(isNum), bag: bag.filter(isNum), cur: isNum(curKey) ? curKey : null }));
  }
  function loadAlbum(){
    try {
      const a = JSON.parse(store.get(ALBUM) || 'null');
      if (a && Array.isArray(a.keys)){ album = a.keys; bag = (a.bag || []).filter(k => album.includes(k)); curKey = a.cur; }
    } catch(e){}
    syncAlbum();
  }
  function syncAlbum(){
    const n = album.length;
    $('#album').hidden = !n;
    $('#albumN').textContent = n;
    // 동화 그림이면 늘 「다른 그림으로」, 사진은 묶음이 있을 때만 「다른 사진으로」 (그때는 「그림 보기」와 둘만)
    const nextOn = mode === 'art' || !!n;
    $('#doneNext').hidden = !nextOn;
    $('#doneAgain').hidden = nextOn;
  }
  // 무엇으로 할지: 'art' 동화 그림(기본) / 'photo' 내 사진
  function setMode(m){
    mode = m; store.set(MODE, m);
    for (const b of $('#mode').querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', b.dataset.v === m ? 'true' : 'false');
    syncAlbum(); stopAuto();
  }

  async function useAlbum(list){
    let files = [...list].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name));
    if (!files.length){ toast('사진 파일이 없어요. 사진이 들어 있는 폴더를 골라 주세요.'); return; }
    shuffle(files);
    // 장수 제한 없음 — 사진이 많으니 브라우저가 저장한 사진을 함부로 지우지 않게 부탁해 둔다
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    const job = ++importJob;
    // start a game straight away with the first photo that opens
    let first = -1, firstImg = null;
    for (let i = 0; i < files.length && first < 0; i++){
      try { firstImg = landscape(await loadFit(files[i])); first = i; } catch(e){}
    }
    if (job !== importJob) return;
    if (first < 0){ toast('이 사진들은 열 수 없어요. 사진(JPG·PNG) 파일을 골라 주세요.'); return; }
    saveWarned = false;
    newGame(firstImg, level(), false);

    // remember the photos (shrunk) so the album survives closing the app
    let stored = true;
    try { await idb('readwrite', st => st.clear()); } catch(e){ stored = false; }
    if (job !== importJob) return;
    if (!stored){
      album = files.slice(first); curKey = album[0]; bag = album.slice(1);
      syncAlbum(); saveAlbum();
      toast(`사진 ${album.length}장으로 묶음을 만들었어요. (앱을 닫으면 묶음은 잊어요)`);
      return;
    }
    album = []; bag = []; curKey = 0;
    let key = 0;
    for (let i = first; i < files.length; i++){
      try {
        const c = i === first ? firstImg : await loadFit(files[i]);
        const blob = await toJpeg(c);
        if (job !== importJob) return;
        const k = key++;
        await idb('readwrite', st => st.put(blob, k));
        if (job !== importJob) return;
        album.push(k); if (k !== curKey) bag.push(k);
      } catch(e){ if (job !== importJob) return; }
      if (album.length % 10 === 0){ syncAlbum(); saveAlbum(); if (files.length - first > 10) toast(`사진 묶음 정리 중… ${album.length}/${files.length - first}`); }
    }
    syncAlbum(); saveAlbum();
    toast(`사진 ${album.length}장으로 묶음을 만들었어요. 다 찾으면 다른 사진이 나와요.`);
  }

  let nexting = false;
  async function nextPhoto(){
    stopAuto();
    if (mode === 'art'){ $('#done').hidden = true; newArt(level()); return; }
    if (!album.length || nexting) return;
    nexting = true;
    try {
      for (let tries = 0; tries < 6 && album.length; tries++){
        if (!bag.length) bag = album.filter(k => k !== curKey);
        if (!bag.length) bag = album.slice();
        const k = bag.splice(Math.floor(Math.random()*bag.length), 1)[0];
        try {
          const blob = isNum(k) ? await idb('readonly', st => st.get(k)) : k;
          if (!blob) throw new Error('missing');
          const img = await loadFit(blob);
          curKey = k; saveAlbum();
          $('#done').hidden = true;
          newGame(landscape(img), level(), false);
          return;
        } catch(e){ album = album.filter(x => x !== k); syncAlbum(); saveAlbum(); }
      }
      toast('다음 사진을 열지 못했어요. 사진을 다시 골라 주세요.');
    } finally { nexting = false; }
  }
  function clearAlbum(){
    importJob++; album = []; bag = []; curKey = null;
    idb('readwrite', st => st.clear()).catch(() => {});
    stopAuto(); syncAlbum(); saveAlbum();
  }

  // after a finish, move on to another photo by itself unless the player stops it
  let autoT = 0, autoN = 0;
  const nextLabel = () => mode === 'art' ? '다른 그림으로' : '다른 사진으로';
  function stopAuto(){ clearInterval(autoT); autoT = 0; $('#doneNext').textContent = nextLabel(); }
  function startAuto(){
    stopAuto(); autoN = AUTO_SEC;
    const b = $('#doneNext'), show = () => { b.textContent = `${nextLabel()} (${autoN})`; };
    show();
    autoT = setInterval(() => { if (document.hidden) return; if (--autoN <= 0) nextPhoto(); else show(); }, 1000);
  }

  // ---------- UI ----------
  const fmt = ms => {
    const t = Math.floor(ms/1000), hh = Math.floor(t/3600), mm = Math.floor(t/60) % 60, ss = String(t % 60).padStart(2, '0');
    return hh ? `${hh}:${String(mm).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
  };
  function syncStats(){
    if (!G) return;
    $('#tm').textContent = fmt(G.elapsed);
    $('#pc').textContent = `${foundN()}/${G.objs.length}`;
  }
  function syncUI(){
    syncLevel(G.level);
    $('#done').hidden = !(G.done && showDone);
    $('#hint').hidden = G.done;
    $('#dTm').textContent = fmt(G.elapsed);
    $('#dPc').textContent = `${G.objs.length}개`;
    syncList(); syncStats(); dirty = true;
  }
  let toastT = 0;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200);
  }
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');

  $('#file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); saveWarned = false; setMode('photo'); newGame(landscape(fit(im, 1800)), level(), false); };
    im.onerror = () => { URL.revokeObjectURL(url); toast('이 파일은 열 수 없어요. 사진(JPG·PNG) 파일을 골라 주세요.'); };
    im.src = url;
  });
  $('#dir').addEventListener('change', e => {
    const fs = e.target.files ? [...e.target.files] : [];
    e.target.value = '';
    if (fs.length){ setMode('photo'); useAlbum(fs); }
  });
  $('#mode').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || b.dataset.v === mode) return;
    setMode(b.dataset.v);
    if (mode === 'art') newArt(level());
    else if (album.length) nextPhoto();
    else { newGame(sampleImage(), level(), true); toast('「사진 한 장 고르기」나 「폴더 고르기」로 사진을 넣어 주세요.'); }
  });
  // folder picking doesn't work on iPhone/iPad; there the same button picks several photos instead
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!('webkitdirectory' in $('#dir')) || iOS){
    const d = $('#dir'); d.removeAttribute('webkitdirectory'); d.accept = 'image/*';
    $('#dirLbl').textContent = '사진 여러 장 고르기';
  }
  $('#next').addEventListener('click', nextPhoto);
  $('#doneNext').addEventListener('click', nextPhoto);
  const clr = $('#albumClear');
  let clrT = 0;
  clr.addEventListener('click', () => {
    if (clr.dataset.armed !== '1'){
      clr.dataset.armed = '1'; clr.textContent = '한 번 더 누르면 비워요';
      clearTimeout(clrT); clrT = setTimeout(() => { clr.dataset.armed = '0'; clr.textContent = '묶음 비우기'; }, 2600);
      return;
    }
    clearTimeout(clrT); clr.dataset.armed = '0'; clr.textContent = '묶음 비우기';
    clearAlbum();
  });
  $('#level').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || !G || +b.dataset.v === G.level) return;
    syncLevel(+b.dataset.v);
    newGame(G.base, +b.dataset.v, G.sample, G.dataURL, G.art);
  });
  $('#sound').addEventListener('click', e => { soundOn = !soundOn; toggle(e.currentTarget, soundOn); if (soundOn){ wakeAudio(); beep(660, .08); } });
  const again = $('#again');
  let armT = 0;
  const disarm = () => { again.dataset.armed = '0'; again.textContent = '새로 숨기기'; };
  again.addEventListener('click', () => {
    if (!G) return;
    if (foundN() > 0 && !G.done && again.dataset.armed !== '1'){
      again.dataset.armed = '1'; again.textContent = '한 번 더 누르면 숨겨요';
      clearTimeout(armT); armT = setTimeout(disarm, 2600);
      return;
    }
    clearTimeout(armT); disarm();
    newGame(G.base, G.level, G.sample, G.dataURL, G.art);
  });
  $('#doneAgain').addEventListener('click', () => { stopAuto(); newGame(G.base, G.level, G.sample, G.dataURL, G.art); });
  $('#gear').addEventListener('click', () => { stopAuto(); syncStats(); $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full');
  const fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => toast('이 기기에서는 전체 화면을 쓸 수 없어요.')); }
    } catch(e){ toast('이 기기에서는 전체 화면을 쓸 수 없어요.'); }
    $('#menu').hidden = true;
  });
  $('#doneClose').addEventListener('click', () => { stopAuto(); showDone = false; $('#done').hidden = true; });

  // clock: runs only after the first tap and while the page is visible
  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (G && G.started && !G.done && !document.hidden){ G.elapsed += now - last; syncStats(); }
    last = now;
  }, 500);
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden) save(); else if (G && G.started) wake();
  });
  window.addEventListener('pagehide', save);

  new ResizeObserver(layout).observe(stage);

  boot();
  requestAnimationFrame(frame);
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
